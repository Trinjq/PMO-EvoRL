# GPU-oriented variant: preserve replay samples per raw transition while using
# a four-times larger batch and one-quarter critic UTD.
num_envs: 640
num_eval_envs: 10
num_preference_workers: 10
rollout_length: 1

discount: 0.995
exploration_epsilon: 0.1
policy_noise: 0.2
clip_policy_noise: 0.5
angle_coefficient: 10.0
tau: 0.005

batch_size: 1024
replay_buffer_capacity: 2000000
random_timesteps: 0
learning_start_timesteps: 1540
her_start_timesteps: 100000
her_weight_num: 3
lazy_preference_her: true
sample_many: true
interpolator_eval_episodes: 3
key_update_interval: 1

# 1024 * 0.25 = 256 replay samples per raw transition; actor/critic ratio stays 0.1.
critic_updates_per_transition: 0.25
actor_updates_per_transition: 0.025
actor_update_interval: 10
num_updates_per_iter: 16
optimizer:
  lr: 0.0003
  grad_clip_norm: 100.0

total_timesteps: 1000000
fold_iters: 100
interpolator_check_iters: 10
eval_episodes: 3
pareto_step_size: 0.005
pareto_eval_batch_size: 201
seed: 1

output_dir: outputs/gpu_optimized_1m
save_replay_buffer: false
checkpoint:
  enable: true
  save_interval_steps: 50000
  max_to_keep: 3
